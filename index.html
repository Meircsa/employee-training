<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Training Information</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    margin:0;
    padding:30px;
}

.card{
    background:white;
    max-width:1000px;
    margin:auto;
    padding:30px;
    border-radius:12px;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
}

h1{
    text-align:center;
    color:#0B5FA5;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#0B5FA5;
    color:white;
    padding:12px;
}

td{
    padding:10px;
    border-bottom:1px solid #ddd;
}

.valid{
    background:#e8f5e9;
}

.expired{
    background:#ffe5e5;
}
</style>
</head>

<body>

<div class="card">

<h1>Employee Training Information</h1>

<p><b>ID:</b> <span id="empId"></span></p>
<p><b>Name:</b> <span id="empName"></span></p>
<p><b>Company:</b> <span id="company"></span></p>

<table>
<thead>
<tr>
<th>Course</th>
<th>Issue Date</th>
<th>Expiry Date</th>
<th>Status</th>
</tr>
</thead>

<tbody id="courseTable"></tbody>

</table>

</div>

<script>

const employeeId =
new URLSearchParams(window.location.search).get("id");

const sampleData = {
"2318928799": {
    id: "2318928799",
    name: "Shamek Odeh",
    company: "Zahran",
    courses: [
        {
            course: "Safety Induction",
            issue: "2026-02-09",
            expiry: "2028-02-08"
        },
        {
            course: "First Aid",
            issue: "2025-06-01",
            expiry: "2027-06-01"
        }
    ]
}
};

if (sampleData[employeeId]) {

    const emp = sampleData[employeeId];

    document.getElementById("empId").innerText = emp.id;
    document.getElementById("empName").innerText = emp.name;
    document.getElementById("company").innerText = emp.company;

    let rows = "";

    emp.courses.forEach(course => {

        let status = "Valid";
        let css = "valid";

        if (new Date(course.expiry) < new Date()) {
            status = "Expired";
            css = "expired";
        }

        rows += `
        <tr class="${css}">
            <td>${course.course}</td>
            <td>${course.issue}</td>
            <td>${course.expiry}</td>
            <td>${status}</td>
        </tr>
        `;
    });
