<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Employee Training Information</title>

<style>

/* =========================================
   GENERAL
========================================= */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:35px 20px;
    font-family:"Segoe UI", Arial, sans-serif;
    background:linear-gradient(135deg,#eef3f8,#f8fafc);
    color:#263238;
    min-height:100vh;
}


/* =========================================
   MAIN CARD
========================================= */

.card{
    width:100%;
    max-width:1250px;
    margin:auto;
    background:#ffffff;
    border-radius:20px;
    box-shadow:
        0 10px 35px rgba(0,0,0,.10),
        0 2px 8px rgba(0,0,0,.05);
    overflow:hidden;
}


/* =========================================
   HEADER
========================================= */

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:30px;
    padding:28px 40px;
    background:#ffffff;
    border-bottom:1px solid #e6ebf0;
}


/* LOGOS AS IMAGES */

.logo{
    width:180px;
    height:90px;
    object-fit:contain;
    display:block;
    flex-shrink:0;
}


/* CENTER TITLE */

.title{
    flex:1;
    text-align:center;
}

.title h1{
    margin:0;
    color:#0B5FA5;
    font-size:28px;
    font-weight:700;
    letter-spacing:.2px;
}

.title p{
    margin:7px 0 0;
    color:#7a8793;
    font-size:14px;
}


/* =========================================
   CONTENT
========================================= */

.content{
    padding:35px 40px 40px;
}


/* =========================================
   EMPLOYEE INFORMATION
========================================= */

.info{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    margin-bottom:35px;
}

.info-box{
    position:relative;
    padding:20px 22px;
    background:#f8fafc;
    border:1px solid #e5ebf0;
    border-radius:14px;
    transition:.25s ease;
}

.info-box:hover{
    transform:translateY(-2px);
    box-shadow:0 5px 18px rgba(0,0,0,.07);
}

.info-label{
    display:block;
    margin-bottom:8px;
    color:#7b8794;
    font-size:13px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.7px;
}

.info-value{
    display:block;
    color:#0B5FA5;
    font-size:19px;
    font-weight:700;
    word-break:break-word;
}


/* =========================================
   SECTION TITLE
========================================= */

.section-title{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:15px;
}

.section-title::before{
    content:"";
    width:5px;
    height:25px;
    background:#0B5FA5;
    border-radius:5px;
}

.section-title h2{
    margin:0;
    font-size:20px;
    color:#263238;
}


/* =========================================
   TABLE
========================================= */

.table-container{
    width:100%;
    overflow-x:auto;
    border:1px solid #e3e8ed;
    border-radius:14px;
}

table{
    width:100%;
    min-width:700px;
    border-collapse:collapse;
}

thead th{
    padding:16px 14px;
    background:#0B5FA5;
    color:#ffffff;
    font-size:15px;
    font-weight:600;
    text-align:center;
    white-space:nowrap;
}

thead th:first-child{
    text-align:left;
    padding-left:22px;
}

tbody td{
    padding:17px 14px;
    text-align:center;
    font-size:15px;
    border-bottom:1px solid #edf0f3;
    color:#45515c;
    background:#ffffff;
}

tbody td:first-child{
    text-align:left;
    padding-left:22px;
    font-weight:600;
    color:#263238;
}

tbody tr:last-child td{
    border-bottom:none;
}


/* =========================================
   COURSE STATUS ROWS
========================================= */

tr.valid td{
    background:#f1faf3;
}

tr.expired td{
    background:#fff3f3;
}

tr.expiring td{
    background:#fff9ed;
}


/* =========================================
   STATUS BADGES
========================================= */

.status{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    min-width:105px;
    padding:7px 13px;
    border-radius:30px;
    font-size:13px;
    font-weight:700;
    white-space:nowrap;
}

.status-valid{
    background:#e5f6e9;
    color:#23843b;
}

.status-expired{
    background:#ffe5e5;
    color:#c62828;
}

.status-expiring{
    background:#fff0cc;
    color:#a66a00;
}


/* =========================================
   FOOTER
========================================= */

.footer{
    margin-top:30px;
    padding-top:20px;
    border-top:1px solid #e8edf1;
    text-align:center;
    color:#8a959f;
    font-size:12px;
}


/* =========================================
   NOT FOUND
========================================= */

.notfound{
    padding:80px 30px;
    text-align:center;
}

.notfound-icon{
    width:75px;
    height:75px;
    margin:0 auto 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fff0f0;
    border-radius:50%;
    font-size:34px;
}

.notfound h2{
    margin:0 0 10px;
    color:#c62828;
    font-size:25px;
}

.notfound p{
    margin:0;
    color:#7b8794;
    font-size:15px;
}


/* =========================================
   LOADING
========================================= */

.loading{
    padding:70px 20px;
    text-align:center;
    color:#7b8794;
}

.spinner{
    width:40px;
    height:40px;
    margin:0 auto 18px;
    border:4px solid #e6edf3;
    border-top-color:#0B5FA5;
    border-radius:50%;
    animation:spin .8s linear infinite;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* =========================================
   TABLET
========================================= */

@media(max-width:900px){

    .header{
        padding:25px;
        gap:15px;
    }

    .logo{
        width:140px;
        height:70px;
    }

    .title h1{
        font-size:23px;
    }

    .content{
        padding:25px;
    }

    .info{
        grid-template-columns:1fr;
        gap:12px;
    }

}


/* =========================================
   MOBILE
========================================= */

@media(max-width:600px){

    body{
        padding:10px;
    }

    .card{
        border-radius:14px;
    }

    .header{
        flex-direction:column;
        padding:22px 15px;
        gap:10px;
    }

    .logo{
        width:145px;
        height:65px;
    }

    .title{
        order:2;
    }

    .title h1{
        font-size:21px;
    }

    .title p{
        font-size:12px;
    }

    .content{
        padding:20px 15px 25px;
    }

    .info-box{
        padding:17px;
    }

    .info-value{
        font-size:17px;
    }

    .section-title h2{
        font-size:18px;
    }

    thead th{
        padding:13px 10px;
        font-size:13px;
    }

    tbody td{
        padding:14px 10px;
        font-size:13px;
    }

    tbody td:first-child,
    thead th:first-child{
        padding-left:15px;
    }

}


/* =========================================
   VERY SMALL SCREENS
========================================= */

@media(max-width:400px){

    .logo{
        width:125px;
        height:55px;
    }

    .title h1{
        font-size:19px;
    }

    .info-value{
        font-size:16px;
    }

}

</style>

</head>

<body>

<div class="card" id="mainCard">

```
<!-- =====================================
     HEADER
====================================== -->

<div class="header">


    <!-- MEIRC LOGO -->

    <img
        src="images/NEW Transparent.png"
        class="logo"
        alt=""
    >


    <!-- TITLE -->

    <div class="title">

        <h1>
            Employee Training Information
        </h1>

        <p>
            Training Records &amp; Certification Status
        </p>

    </div>


    <!-- MAADEN LOGO -->

    <img
        src="images/MAADEN New Logo.jpg"
        class="logo"
        alt=""
    >

</div>


<!-- =====================================
     CONTENT
====================================== -->

<div class="content" id="contentArea">


    <!-- LOADING -->

    <div class="loading" id="loading">

        <div class="spinner"></div>

        Loading employee information...

    </div>


</div>
```

</div>

<script>


/* =========================================
   GET EMPLOYEE ID FROM URL
========================================= */

const employeeId =
    new URLSearchParams(window.location.search).get("id");


/* =========================================
   FORMAT DATE
========================================= */

function formatDate(dateString){

    const date = new Date(dateString);

    if(isNaN(date)){
        return "-";
    }

    return date.toLocaleDateString(
        "en-US",
        {
            year:"numeric",
            month:"long",
            day:"numeric"
        }
    );

}


/* =========================================
   DETERMINE COURSE STATUS
========================================= */

function getCourseStatus(expiryDate){

    const today = new Date();

    today.setHours(0,0,0,0);


    const expiry = new Date(expiryDate);

    expiry.setHours(0,0,0,0);


    /* EXPIRED */

    if(expiry < today){

        return {

            rowClass:"expired",

            badgeClass:"status-expired",

            text:"❌ Expired"

        };

    }


    /* CALCULATE REMAINING DAYS */

    const difference =
        expiry.getTime() - today.getTime();


    const daysRemaining =
        Math.ceil(
            difference /
            (1000 * 60 * 60 * 24)
        );


    /* EXPIRING SOON */

    if(daysRemaining <= 30){

        return {

            rowClass:"expiring",

            badgeClass:"status-expiring",

            text:"⚠️ Expiring Soon"

        };

    }


    /* VALID */

    return {

        rowClass:"valid",

        badgeClass:"status-valid",

        text:"✅ Valid"

    };

}


/* =========================================
   LOAD EMPLOYEE DATA
========================================= */

async function loadEmployee(){

    try{


        /* CHECK EMPLOYEE ID */

        if(!employeeId){

            throw new Error(
                "Employee ID missing"
            );

        }


        /* FETCH JSON FILE */

        const response =
            await fetch(
                `data/${employeeId}.json`
            );


        /* CHECK RESPONSE */

        if(!response.ok){

            throw new Error(
                "Employee not found"
            );

        }


        /* READ JSON */

        const emp =
            await response.json();


        /* =====================================
           CREATE COURSE ROWS
        ====================================== */

        let rows = "";


        emp.courses.forEach(course => {


            const status =
                getCourseStatus(
                    course.expiry
                );


            rows += `

                <tr class="${status.rowClass}">


                    <td>
                        ${course.course}
                    </td>


                    <td>
                        ${formatDate(course.issue)}
                    </td>


                    <td>
                        ${formatDate(course.expiry)}
                    </td>


                    <td>

                        <span
                            class="status ${status.badgeClass}"
                        >

                            ${status.text}

                        </span>

                    </td>


                </tr>

            `;

        });


        /* =====================================
           DISPLAY EMPLOYEE INFORMATION
        ====================================== */

        document.getElementById(
            "contentArea"
        ).innerHTML = `


            <!-- EMPLOYEE INFORMATION -->

            <div class="info">


                <!-- EMPLOYEE ID -->

                <div class="info-box">

                    <span class="info-label">
                        Employee ID
                    </span>

                    <span class="info-value">
                        ${emp.id}
                    </span>

                </div>


                <!-- EMPLOYEE NAME -->

                <div class="info-box">

                    <span class="info-label">
                        Employee Name
                    </span>

                    <span class="info-value">
                        ${emp.name}
                    </span>

                </div>


                <!-- COMPANY -->

                <div class="info-box">

                    <span class="info-label">
                        Company
                    </span>

                    <span class="info-value">
                        ${emp.company}
                    </span>

                </div>


            </div>



            <!-- TRAINING RECORDS TITLE -->

            <div class="section-title">

                <h2>
                    Training Records
                </h2>

            </div>



            <!-- TRAINING TABLE -->

            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Course
                            </th>

                            <th>
                                Issue Date
                            </th>

                            <th>
                                Expiry Date
                            </th>

                            <th>
                                Status
                            </th>

                        </tr>

                    </thead>


                    <tbody id="courseTable">

                        ${rows}

                    </tbody>


                </table>

            </div>



            <!-- FOOTER -->

            <div class="footer">

                Employee Training Information System

            </div>

        `;

    }


    /* =====================================
       ERROR
    ====================================== */

    catch(error){

        document.getElementById(
            "contentArea"
        ).innerHTML = `


            <div class="notfound">


                <div class="notfound-icon">
                    ❌
                </div>


                <h2>
                    Employee Not Found
                </h2>


                <p>
                    No training information was found
                    for the requested employee.
                </p>


            </div>

        `;

    }

}


/* =========================================
   START
========================================= */

loadEmployee();

</script>

</body>

</html>
