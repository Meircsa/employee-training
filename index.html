<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Training Information</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    margin:0;
    padding:30px;
}

.card{
    background:white;
    max-width:1200px;
    margin:auto;
    padding:30px;
    border-radius:15px;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    border-bottom:2px solid #e5e5e5;
    padding-bottom:20px;
    margin-bottom:30px;
}

.logo{
    width:220px;
    height:100px;
    object-fit:contain;
}

.title{
    flex:1;
    text-align:center;
}

.title h1{
    margin:0;
    color:#0B5FA5;
    font-size:24px;
    font-weight:700;
}

.info{
    text-align:center;
    margin:30px 0;
}

.info p{
    font-size:24px;
    margin:15px 0;
    font-weight:bold;
}

#empId,
#empName,
#company{
    color:#0B5FA5;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th{
    background:#0B5FA5;
    color:white;
    padding:14px;
    font-size:18px;
}

td{
    padding:14px;
    text-align:center;
    border-bottom:1px solid #ddd;
    font-size:17px;
}

tr.valid td{
    background:#e8f5e9;
    color:#2e7d32;
}

tr.expired td{
    background:#ffe5e5;
    color:#c62828;
}

.notfound{
    text-align:center;
    padding:60px;
    font-size:24px;
    color:#c62828;
}

@media(max-width:768px){

    body{
        padding:10px;
    }

    .card{
        padding:15px;
    }

    .header{
        flex-direction:column;
    }

    .logo{
        width:140px;
        height:auto;
    }

    .title h1{
        font-size:20px;
    }

    .info p{
        font-size:18px;
    }

    th,
    td{
        padding:8px;
        font-size:14px;
    }

}

</style>
</head>

<body>

<div class="card">

    <div class="header">

    <img
        src="images/NEW Transparent.png"
        class="logo"
        alt=ng Information</h1>
    </div>

    <img
        src="images/MAADEN NEW Logo.jpg"
        class="logo
    </div>

    <div class="info">

        <p>
            ID:
            <span id="empId"></span>
        </p>

        <p>
            Name:
            <span id="empName"></span>
        </p>

        <p>
            Company:
            <span id="company"></span>
        </p>

    </div>

    <table>

        <thead>
            <tr>
                <th>Course</th>
                <th>Issue Date</th>
                <th>Expiry Date</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody id="courseTable"></tbody>

    </table>

</div>

<script>

const employeeId =
new URLSearchParams(window.location.search).get("id");

function formatDate(dateString){

    return new Date(dateString).toLocaleDateString(
        "en-US",
        {
            year:"numeric",
            month:"long",
            day:"numeric"
        }
    );

}

async function loadEmployee(){

    try{

        const response =
        await fetch(`data/${employeeId}.json`);

        if(!response.ok){
            throw new Error("Employee not found");
        }

        const emp =
        await response.json();

        document.getElementById("empId").textContent =
        emp.id;

        document.getElementById("empName").textContent =
        emp.name;

        document.getElementById("company").textContent =
        emp.company;

        let rows = "";

        emp.courses.forEach(course => {

            const expiryDate =
            new Date(course.expiry);

            const today =
            new Date();

            let rowClass = "valid";
            let status = "✅ Valid";

            if(expiryDate < today){

                rowClass = "expired";
                status = "❌ Expired";

            }

            rows += `
            <tr class="${rowClass}">
                <td>${course.course}</td>
                <td>${formatDate(course.issue)}</td>
                <td>${formatDate(course.expiry)}</td>
                <td>${status}</td>
            </tr>
            `;
        });

        document.getElementById("courseTable").innerHTML =
        rows;

    }
    catch(error){

        document.querySelector(".card").innerHTML = `
        <div class="notfound">
            ❌ Employee not found
        </div>
        `;

    }

}

loadEmployee();

</script>

</body>
</html>
