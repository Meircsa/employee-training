<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Training Information</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    margin:0;
    padding:30px;
}

.card{
    background:white;
    max-width:1000px;
    margin:auto;
    padding:30px;
    border-radius:12px;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
}

.header{
    text-align:center;
    margin-bottom:25px;
}

.header h1{
    color:#0B5FA5;
}

.info{
    margin-bottom:20px;
}

.info p{
    font-size:18px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#0B5FA5;
    color:white;
    padding:12px;
}

td{
    padding:10px;
    border-bottom:1px solid #ddd;
    text-align:center;
}

.valid{
    background:#e8f5e9;
    color:#2e7d32;
}

.expired{

    color:#c62828;
}

</style>
</head>

<body>
